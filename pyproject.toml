[project]
name = "myowntvapp"
version = "0.1.0"
description = "Self-hosted web app for watching live sports and TV streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "aiohttp>=3.9.0",
    "pyatv>=0.14.0",
    "m3u8>=4.0.0",
    "python-multipart>=0.0.7",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx2>=2.12.0",
]

[tool.uv]
# The app runs from source; there is nothing to build or install as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
